# Netlify reads this file when it builds the site.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # The site is plain static files (output: 'export'), so skip Netlify's
  # Next.js server runtime and just publish the out/ folder.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
